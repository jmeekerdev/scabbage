# Every push to main is checked, then released as the next patch of VERSION (MAJOR.MINOR).
name: release
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: echo "tag=$(git tag | scripts/next-version.sh "$(cat VERSION)")" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: build
        run: nix-shell --run "make release VERSION=$TAG"
      - name: publish
        run: gh release create "$TAG" bin/release/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
