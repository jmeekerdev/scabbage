<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#87ceeb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Scabbage</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div><strong>Scabbage</strong> <span id="status">starting</span></div>
      <div id="ping"></div>
      <div id="hud-buttons"></div>
    </div>
    <div id="crosshair" hidden></div>
    <div id="touch" hidden></div>
    <div id="chat"></div>
    <div id="emotes" hidden></div>
    <div id="hotbar"></div>
    <div id="hint" hidden>
      Click to play · WASD move · Space jump (tap twice to fly) · Shift fly down · Left click break
      · Right click place · 1–9 or wheel choose block · Middle click copy block · T chat · Hold E
      emote · Esc for mouse · Gamepads work too
    </div>
    <div id="rotate">Turn your phone sideways to play</div>
    <div id="toasts" aria-live="polite"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
