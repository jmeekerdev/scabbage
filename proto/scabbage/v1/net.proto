syntax = "proto3";

package scabbage.v1;

option go_package = "scabbage/internal/pb/scabbage/v1;scabbagev1";

// Bump CURRENT on any incompatible protocol change.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 21;
}

// Every WebSocket binary frame from a client is one ClientMessage.
message ClientMessage {
  oneof body {
    Hello hello = 1;
    Ping ping = 2;
    DecideJoin decide_join = 3;
    CreateJoinCode create_join_code = 4;
    RequestChunks request_chunks = 5;
    Move move = 6;
    EditBlock edit_block = 7;
    SendChat send_chat = 8;
    SendEmote send_emote = 9;
    SubmitArt submit_art = 10;
    DecideArt decide_art = 11;
    SetAdmin set_admin = 12;
    SetGameMode set_game_mode = 13;
    MoveItem move_item = 14;
    Craft craft = 15;
    HitMob hit_mob = 16;
    UseBlock use_block = 17;
    HitPlayer hit_player = 18;
    OpenScript open_script = 19;
    SaveScript save_script = 20;
    TalkTo talk_to = 21;
    Answer answer = 22;
    ImportMap import_map = 23;
  }
}

// Every WebSocket binary frame from the server is one ServerMessage.
message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    Pong pong = 2;
    Disconnect disconnect = 3;
    JoinPending join_pending = 4;
    PendingRequests pending_requests = 5;
    JoinCodeCreated join_code_created = 6;
    ChunkBatch chunk_batch = 7;
    Teleport teleport = 8;
    BlockChanged block_changed = 9;
    PlayersJoined players_joined = 10;
    PlayersMoved players_moved = 11;
    PlayerLeft player_left = 12;
    Chat chat = 13;
    EmoteShown emote_shown = 14;
    ArtRequests art_requests = 15;
    BlocksChanged blocks_changed = 16;
    SkinChanged skin_changed = 17;
    PlayerList player_list = 18;
    Vitals vitals = 19;
    Inventory inventory = 20;
    ItemsChanged items_changed = 21;
    MobsChanged mobs_changed = 22;
    ZonesChanged zones_changed = 23;
    BlockBatch block_batch = 24;
    Scoreboard scoreboard = 25;
    ScriptShown script_shown = 26;
    NpcsChanged npcs_changed = 27;
    Dialogue dialogue = 28;
    QuestLog quest_log = 29;
    MapExported map_exported = 30;
    ChunksStale chunks_stale = 31;
  }
}

// First message on every connection.
message Hello {
  uint32 protocol_version = 1;
  string client_name = 2;
  // Random 32 bytes generated once per device; the server stores only its hash.
  bytes device_secret = 3;
  // Set when an unregistered device asks to join with a code.
  JoinRequest join = 4;
  // Admin console: authenticate without entering the world.
  bool console = 5;
}

message JoinRequest {
  string code = 1;
  string name = 2;
  uint32 color = 3; // 0xRRGGBB
}

message Welcome {
  uint32 protocol_version = 1;
  string server_name = 2;
  uint32 tick_rate_hz = 3;
  PlayerInfo you = 4;
  // Unset for admin console connections, which never enter the world.
  WorldInfo world = 5;
  Vitals vitals = 6; // unset for admin console connections
  Inventory inventory = 7; // unset for admin console connections
  // Where the player was last saved, with id 0; unset to start at the world spawn.
  Teleport start = 8;
  QuestLog quests = 9; // unset for admin console connections
}

message WorldInfo {
  int32 radius = 1; // half the border width in blocks; negative means unbounded
  int32 height = 2; // blocks above y=0 that can hold anything
  Vec3 spawn = 3;
  repeated BlockType blocks = 4; // indexed by block ID
  repeated Texture textures = 5; // built-in textures an admin repainted
  repeated Recipe recipes = 6; // what survival players can craft; Craft names them by index
}

message BlockType {
  uint32 id = 1;
  string name = 2;
  bool solid = 3;
  bool transparent = 4;
  bytes pixels = 5; // custom blocks only: 16×16 RGBA, rows top-down
  Shape shape = 6;
  uint32 light = 7; // how brightly it glows, 0 to 12
  uint32 mine_ms = 8; // how long survival players dig to break it; 0 is instant
  bool usable = 9; // players press it by hand, like a switch
  uint32 item = 10; // the block players hold for this one, when it differs
}

// Block geometry; stairs' tall half faces the named direction (north is -z).
enum Shape {
  SHAPE_UNSPECIFIED = 0; // a full cube
  SHAPE_SLAB = 1;
  SHAPE_STAIRS_NORTH = 2;
  SHAPE_STAIRS_EAST = 3;
  SHAPE_STAIRS_SOUTH = 4;
  SHAPE_STAIRS_WEST = 5;
  SHAPE_TORCH = 6;
  SHAPE_FLAT = 7; // a thin layer on the floor, like wire
}

// A built-in block texture repainted by an admin, e.g. "grass_side".
message Texture {
  string name = 1;
  bytes pixels = 2; // 16×16 RGBA, rows top-down
}

// The full block list and repainted textures, sent when an admin approves a block or texture.
message BlocksChanged {
  repeated BlockType blocks = 1;
  repeated Texture textures = 2;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message ChunkPos {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

// Asks for chunks (at most 64 per request); the server answers with one ChunkBatch that
// leaves out chunks too far from the player.
message RequestChunks {
  repeated ChunkPos chunks = 1;
}

message ChunkBatch {
  repeated ChunkData chunks = 1;
}

// data is the palette + run-length encoding from server/internal/world/codec.go.
message ChunkData {
  ChunkPos pos = 1;
  bytes data = 2;
}

// The player's own position (feet center) and view, sent up to 20 times a second while it changes.
message Move {
  Vec3 pos = 1;
  float yaw = 2;
  float pitch = 3;
  // The last Teleport id applied; moves made before the latest teleport are ignored.
  uint32 teleport = 4;
  bool flying = 5;
}

// Puts the player at pos, e.g. when the server rejects a move. Ids count up from 1.
message Teleport {
  uint32 id = 1;
  Vec3 pos = 2;
  Restore restore = 3; // set when returning the player to a save
}

// How the player was facing and moving when saved.
message Restore {
  float yaw = 1;
  float pitch = 2;
  bool flying = 3;
}

message BlockPos {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
}

// Breaks (block 0, air) or places a block. The server answers with BlockChanged: to everyone if
// the edit was allowed, otherwise to the sender with the block that is really there.
message EditBlock {
  BlockPos pos = 1;
  uint32 block = 2;
  uint32 slot = 3; // survival placements: the inventory slot the block comes from
}

// Presses the switch or button at pos.
message UseBlock {
  BlockPos pos = 1;
}

message BlockChanged {
  BlockPos pos = 1;
  uint32 block = 2;
}

// Many blocks that changed at once, like a whole circuit switching on.
message BlockBatch {
  repeated BlockChanged blocks = 1;
}

// Other players in the world. Entity ids are per connection, so one player on two devices is two.
message OtherPlayer {
  uint32 entity = 1;
  string name = 2;
  uint32 color = 3; // 0xRRGGBB
  PlayerPose pose = 4;
  bytes skin = 5; // 64×32 RGBA, rows top-down; empty means the default look from color
}

// Someone's new skin was approved.
message SkinChanged {
  uint32 entity = 1;
  bytes skin = 2;
}

message PlayerPose {
  uint32 entity = 1;
  Vec3 pos = 2; // feet center
  float yaw = 3;
  float pitch = 4;
}

// Sent to a newcomer with everyone already there, and to everyone else when someone arrives.
message PlayersJoined {
  repeated OtherPlayer players = 1;
}

// Once per tick, the players that moved since the last one (never the recipient).
message PlayersMoved {
  repeated PlayerPose poses = 1;
}

message PlayerLeft {
  uint32 entity = 1;
}

// A line typed into chat; text starting with "/" is a command such as "/approve NAME".
message SendChat {
  string text = 1;
}

// A chat line for everyone in the world, the sender included. Notices come from the server,
// e.g. replies to commands, and go to one player.
message Chat {
  string name = 1;
  uint32 color = 2; // 0xRRGGBB
  string text = 3;
  bool notice = 4;
}

enum Emote {
  EMOTE_UNSPECIFIED = 0;
  EMOTE_WAVE = 1;
  EMOTE_HAPPY = 2;
  EMOTE_LAUGH = 3;
  EMOTE_LOVE = 4;
  EMOTE_THUMBS_UP = 5;
  EMOTE_WOW = 6;
  EMOTE_SAD = 7;
  EMOTE_PARTY = 8;
}

message SendEmote {
  Emote emote = 1;
}

// Someone else emoted; shown above their avatar.
message EmoteShown {
  uint32 entity = 1;
  Emote emote = 2;
}

message PlayerInfo {
  uint64 id = 1;
  string name = 2;
  uint32 color = 3;
  bool admin = 4;
  bytes skin = 5; // approved skin, empty for the default
  GameMode mode = 6;
}

enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;
  GAME_MODE_CREATIVE = 1; // can fly and never gets hurt
  GAME_MODE_SURVIVAL = 2; // walks, can get hurt and faint
}

enum Harm {
  HARM_UNSPECIFIED = 0;
  HARM_FALL = 1;
  HARM_MOB = 2;
  HARM_PLAYER = 3;
}

// Your own health (0 to 20) and game mode; in Welcome, then sent whenever either changes.
// At 0 you fainted: a Teleport back to spawn and full health follow.
message Vitals {
  GameMode mode = 1;
  uint32 health = 2;
  Harm hurt = 3; // set when health just dropped
}

// Admin only; takes effect at once.
message SetGameMode {
  uint64 player_id = 1;
  GameMode mode = 2;
}

message ItemStack {
  uint32 block = 1; // air for an empty slot
  uint32 count = 2;
}

// Your whole inventory, hotbar slots first; in Welcome, then sent whenever it changes.
message Inventory {
  repeated ItemStack slots = 1;
}

// Moves a stack onto another slot, merging matching blocks and swapping the rest.
message MoveItem {
  uint32 from = 1;
  uint32 to = 2;
}

// Makes one stack from others the player carries, in any arrangement.
message Recipe {
  ItemStack make = 1;
  repeated ItemStack from = 2;
}

// Crafts a recipe once; the server answers with the new Inventory, or nothing if it can't.
message Craft {
  uint32 recipe = 1; // index into WorldInfo.recipes
}

// An item lying in the world, waiting to be picked up.
message ItemDrop {
  uint64 id = 1;
  uint32 block = 2;
  Vec3 pos = 3; // where it rests
}

// Items that appeared or moved, and the ids of ones taken or gone; all of them on join.
message ItemsChanged {
  repeated ItemDrop drops = 1;
  repeated uint64 gone = 2;
}

enum MobKind {
  MOB_KIND_UNSPECIFIED = 0;
  MOB_KIND_SHEEP = 1; // hitting it drops its wool, which grows back
  MOB_KIND_SLIME = 2; // comes out at night and bites survival players; pops after three hits
  MOB_KIND_KING_SLIME = 3; // a boss woken at an altar; lets out slimes as it weakens
  MOB_KIND_GOLEM = 4; // a boss woken at an altar; slow, steady and hits hard
}

message Mob {
  uint32 id = 1;
  MobKind kind = 2;
  Vec3 pos = 3; // feet center
  float yaw = 4; // faces (sin yaw, cos yaw) in x,z
  bool sheared = 5;
  bool hurt = 6; // just got hit
  uint32 health = 7; // bosses only, for their health bar
  uint32 max_health = 8;
}

// Mobs that appeared or moved, and the ids of ones gone; all of them on join.
message MobsChanged {
  repeated Mob mobs = 1;
  repeated uint32 gone = 2;
}

// A protected column of the world, corners included.
message Zone {
  string name = 1;
  int32 x0 = 2;
  int32 z0 = 3;
  int32 x1 = 4;
  int32 z1 = 5;
  bool build = 6; // whether the recipient may change blocks here
  GameMode mode = 7; // unspecified keeps each player's own
  repeated ArenaMark marks = 8; // spawns and goals, when the zone is an arena
  bool pvp = 9; // survival players inside may hit each other
}

// A block in an arena where a team spawns or scores.
message ArenaMark {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  string team = 4; // red, blue, green or yellow; empty for everyone
  bool goal = 5; // a goal rather than a spawn
}

// Every zone, sent on join and whenever one changes; where zones overlap the smallest wins.
message ZonesChanged {
  repeated Zone zones = 1;
}

// Hits a mob within reach.
message HitMob {
  uint32 mob = 1;
}

// Hits another player within reach; only counts where both stand in the same PVP zone.
message HitPlayer {
  uint32 entity = 1;
}

// The join request is waiting for an admin; the connection stays open until a decision.
message JoinPending {}

// Sent to admins on connect and whenever the pending list changes.
message PendingRequests {
  repeated PendingRequest requests = 1;
}

message PendingRequest {
  uint64 id = 1;
  string name = 2;
  uint32 color = 3;
  bool returning = 4; // name matches an existing player
  double created_ms = 5;
}

// Admin only.
message DecideJoin {
  uint64 request_id = 1;
  bool approve = 2;
}

// Every approved player, sent to admins on connect and whenever someone's admin rights change.
message PlayerList {
  repeated PlayerInfo players = 1; // skins left out
}

// Admin only; admins can't change their own rights. The player reconnects to pick up the change.
message SetAdmin {
  uint64 player_id = 1;
  bool admin = 2;
}

// Admin only.
message CreateJoinCode {
  uint32 uses = 1;
  uint32 ttl_hours = 2;
}

enum ArtKind {
  ART_KIND_UNSPECIFIED = 0;
  ART_KIND_SKIN = 1;    // 64×32 RGBA; no pixels goes back to the default look, without approval
  ART_KIND_BLOCK = 2;   // 16×16 RGBA; name is the new block's name
  ART_KIND_TEXTURE = 3; // admin only: repaints the built-in texture `name`; no pixels resets it
}

// Pixel art for an admin to approve; admins' own art is approved at once. Rows run top-down.
message SubmitArt {
  ArtKind kind = 1;
  string name = 2;
  bytes pixels = 3;
}

// Sent to admins on connect and whenever the art waiting for approval changes.
message ArtRequests {
  repeated ArtRequest requests = 1;
}

message ArtRequest {
  uint64 id = 1;
  ArtKind kind = 2;
  string name = 3;
  string author = 4;
  uint32 author_color = 5;
  bytes pixels = 6;
  double created_ms = 7;
}

// Admin only.
message DecideArt {
  uint64 id = 1;
  bool approve = 2;
}

message JoinCodeCreated {
  string code = 1;
  uint32 uses = 2;
  double expires_ms = 3;
}

message Ping {
  double client_time_ms = 1;
}

message Pong {
  double client_time_ms = 1;
  double server_time_ms = 2;
}

enum DisconnectCode {
  DISCONNECT_CODE_UNSPECIFIED = 0;
  DISCONNECT_CODE_PROTOCOL = 1;
  DISCONNECT_CODE_NEED_JOIN_CODE = 2;
  DISCONNECT_CODE_BAD_JOIN_CODE = 3;
  DISCONNECT_CODE_BAD_NAME = 4;
  DISCONNECT_CODE_DENIED = 5;
  DISCONNECT_CODE_RATE_LIMITED = 6;
  DISCONNECT_CODE_NOT_ADMIN = 7;
}

message Disconnect {
  string reason = 1;
  DisconnectCode code = 2;
}

// The minigame round the recipient is in, sent when it changes; an empty zone hides it.
message Scoreboard {
  string zone = 1;
  string status = 2; // e.g. "Waiting for 1 more", "Starting" or "Playing"
  uint32 seconds = 3; // left on the clock when sent; 0 for none
  repeated Score scores = 4;
}

// One player in a round.
message Score {
  string name = 1;
  string team = 2;
  uint32 points = 3;
  bool out = 4;
  string flag = 5; // the team whose flag they carry
}

// Asks to see the Lua in the script block at pos.
message OpenScript {
  BlockPos pos = 1;
}

// Replaces the Lua in the script block at pos; only players who may build there can.
message SaveScript {
  BlockPos pos = 1;
  string source = 2;
}

// A script block's Lua, sent after OpenScript or SaveScript.
message ScriptShown {
  BlockPos pos = 1;
  string source = 2;
  bool editable = 3; // the recipient may build here, so may save
  string error = 4;  // the last error loading or running it, if any
  bool saved = 5;    // this answers a save that was stored
}

// A character a script block stands on top of itself; using it runs the script's on_talk.
message Npc {
  uint32 id = 1;
  string name = 2;
  BlockPos pos = 3; // the block it stands in, just above its script block
}

// Characters that appeared or were renamed, and the ids of ones gone; all of them on join.
message NpcsChanged {
  repeated Npc npcs = 1;
  repeated uint32 gone = 2;
}

// Talks to a character within reach.
message TalkTo {
  uint32 npc = 1;
}

// A script talking to the recipient; with choices it waits for an Answer.
message Dialogue {
  uint32 id = 1;
  string speaker = 2;
  string text = 3;
  repeated string choices = 4;
}

// Picks one of a Dialogue's choices.
message Answer {
  uint32 dialogue = 1;
  uint32 choice = 2; // index into the Dialogue's choices
}

// A quest in the recipient's log; scripts start, update and finish them.
message Quest {
  string title = 1;
  string step = 2; // what to do next; empty once done
  bool done = 3;
}

// The recipient's whole quest log, newest first; in the Welcome and whenever it changes.
message QuestLog {
  repeated Quest quests = 1;
}

// An admin's .scabmap file, to place as a new zone centred on them.
message ImportMap {
  string name = 1;
  bytes data = 2;
}

// A saved map as a .scabmap file, for the admin who asked to export it.
message MapExported {
  string name = 1;
  bytes data = 2;
}

// Chunks that changed too much to send block by block; clients holding them fetch them again.
message ChunksStale {
  repeated ChunkPos chunks = 1;
}
