# Plain HTTP:  docker compose up -d          -> http://<host>:8080
# With TLS:    SCABBAGE_DOMAIN=game.example docker compose --profile tls up -d
# Every setting below can be changed in a .env file next to this one; see .env.example.
services:
  scabbage:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${SCABBAGE_PORT:-8080}:8080"
    environment:
      SCABBAGE_NAME: ${SCABBAGE_NAME:-Scabbage}
      SCABBAGE_MODE: ${SCABBAGE_MODE:-creative}
      SCABBAGE_SPAWN_ZONE: ${SCABBAGE_SPAWN_ZONE:-48}
      SCABBAGE_BACKUPS: ${SCABBAGE_BACKUPS:-7}
      SCABBAGE_BACKUP_HOUR: ${SCABBAGE_BACKUP_HOUR:-4}
      SCABBAGE_ORIGINS: ${SCABBAGE_ORIGINS:-}
      SCABBAGE_TICK_RATE: ${SCABBAGE_TICK_RATE:-20}
      TZ: ${TZ:-UTC} # the backup hour is in this zone; backups go in the data volume's backups/
      GOMEMLIMIT: ${GOMEMLIMIT:-1800MiB}
    volumes:
      - ${SCABBAGE_DATA:-scabbage-data}:/data
    mem_limit: ${SCABBAGE_MEMORY:-2g}
    cpus: ${SCABBAGE_CPUS:-2}

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    ports:
      - "${SCABBAGE_HTTP_PORT:-80}:80"
      - "${SCABBAGE_HTTPS_PORT:-443}:443"
    environment:
      SCABBAGE_DOMAIN: ${SCABBAGE_DOMAIN:-} # needed with the tls profile; Caddy stops without it
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    mem_limit: 128m

volumes:
  scabbage-data:
  caddy-data:
